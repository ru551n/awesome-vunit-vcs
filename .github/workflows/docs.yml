name: Docs

on:
  push:
  pull_request:
  workflow_dispatch:
  # Weekly check of the external links, never on pull requests: an outside
  # site being down must not fail a change
  schedule:
    - cron: '17 5 * * 1'

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sphinx:
    name: Build the documentation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      # The same installation as .readthedocs.yaml
      - name: Install
        run: python -m pip install -r docs/requirements.txt
      - name: Build
        run: sphinx-build -W --keep-going -b html docs "$RUNNER_TEMP/docs_html"
      - name: Check that included code shows no docs markers
        run: |
          python -m pip install pytest
          python -m pytest -p no:cacheprovider tests/python/test_docs.py::test_included_code_never_shows_docs_markers

  linkcheck:
    name: Check the external links
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -r docs/requirements.txt
      - name: Check links
        run: sphinx-build --keep-going -b linkcheck docs "$RUNNER_TEMP/docs_linkcheck"
