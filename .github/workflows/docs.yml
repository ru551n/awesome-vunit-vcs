name: Docs

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sphinx:
    name: Build the documentation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      # The same installation as .readthedocs.yaml
      - name: Install
        run: python -m pip install -r docs/requirements.txt
      - name: Build
        run: sphinx-build -W --keep-going -b html docs "$RUNNER_TEMP/docs_html"
