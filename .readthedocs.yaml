# Read the Docs configuration, https://docs.readthedocs.com/platform/stable/config-file/v2.html
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"

sphinx:
  configuration: docs/conf.py
  fail_on_warning: true

# The package itself is not installed: its dependencies vunit_hdl (the package
# setup hooks) and vunit-python-bridge are not on PyPI yet. docs/conf.py puts
# src on sys.path instead, see the comment there.
python:
  install:
    - requirements: docs/requirements.txt
