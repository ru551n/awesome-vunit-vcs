[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "awesome-vunit-vcs"
version = "0.1.0.dev0"
description = "Third-party VUnit verification components: VHDL pin timing, Python verification semantics."
readme = "README.md"
license = "MPL-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Sebastian Hellgren", email = "sebastian.hellgren@codecache.se" }]
keywords = ["vunit", "vunitpkg", "verification", "vhdl", "fpga", "asic", "ethernet", "gmii"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
    "Topic :: Software Development :: Testing",
]
# Neither VUnit with package setup hooks (VUnit PR #1221, branch
# feature/package-setup-hooks of github.com/ru551n/vunit) nor vunit-python-bridge
# is released yet: tests/packaging/unreleased-requirements.txt pins both.
# NumPy is listed because the backends use it directly for the bulk observation
# arrays.
dependencies = [
    "vunit_hdl>=5.0.0.dev12",
    "vunit-python-bridge>=0.1.0",
    "numpy>=1.24",
]

[project.optional-dependencies]
scapy = ["scapy>=2.5"]
test = ["pytest>=8", "hypothesis>=6.100"]
# Independent reference implementation used only by the test suite
reference = ["cocotbext-eth>=0.1.28"]
dev = [
    "awesome-vunit-vcs[scapy,test]",
    "build>=1.2",
    "mypy>=1.10",
    "ruff~=0.16.7",
    "twine>=5",
]

[project.urls]
Homepage = "https://github.com/ru551n/awesome-vunit-vcs"
Issues = "https://github.com/ru551n/awesome-vunit-vcs/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/awesome_vunit_vcs"]

[tool.hatch.build.targets.sdist]
include = [
    "src/awesome_vunit_vcs",
    "tests",
    "examples",
    "docs",
    "README.md",
    "ARCHITECTURE.md",
    "CONTRIBUTING.md",
    "LICENSE",
]
exclude = ["**/vunit_out", "**/__pycache__"]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["vunit_out"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
# NumPy's stubs need 3.12 syntax; the code itself stays 3.10 compatible (ruff target)
python_version = "3.12"
strict = true
files = ["src/awesome_vunit_vcs"]

[[tool.mypy.overrides]]
module = ["scapy.*", "vunit.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests/python"]
addopts = "-ra"
markers = ["packaging: slow tests that build distributions and virtual environments (tests/packaging)"]
