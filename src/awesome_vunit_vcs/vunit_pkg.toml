[package]
# The VHDL sources use the Python bridge, the vunit-python-bridge package, which
# a run script adds with add_package("vunit-python-bridge", allow_setup=True) next to this one.
# A package cannot depend on another package here, and a setup function could
# only add it through private VUnit state, so the run script adds both.
requires-vunit = ">=5.0.0.dev12"
requires-vhdl = ">=2008"
library = "awesome_vunit_vcs"

# Every VC family keeps its sources in a directory of its own under vhdl/. One
# recursive pattern covers them all, and VUnit refuses a pattern matching no
# file, which a pattern per family would be while the family is empty.
[[package.sources]]
include = ["vhdl/**/*.vhd"]
